<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroha - Choose Career Track</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-white min-h-screen flex items-center justify-center font-sans p-4">

    <div class="w-full max-w-2xl bg-[#111827] border border-gray-800 rounded-3xl p-8 shadow-[0_0_30px_rgba(0,0,0,0.6)]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Select Your Target Track
            </h2>
            <p class="text-gray-400 text-sm mt-2">Choose the role you want to master.</p>
        </div>

        <form id="careerForm" class="space-y-4 mb-8">
            
            <!-- Track 1 (Default checked to prevent script errors) -->
            <label class="flex items-center p-4 bg-[#1f2937] border border-gray-700 rounded-2xl cursor-pointer hover:border-blue-500 transition-all duration-300 group">
                <input type="radio" name="career_track" value="Frontend Developer" checked class="w-4 h-4 text-blue-600 bg-gray-900 border-gray-600 focus:ring-blue-500">
                <div class="ml-4">
                    <span class="block font-semibold text-white group-hover:text-blue-400 transition-colors">Frontend Developer</span>
                    <span class="text-xs text-gray-400">Master modern UI engineering, React, and web design.</span>
                </div>
            </label>

            <!-- Track 2 -->
            <label class="flex items-center p-4 bg-[#1f2937] border border-gray-700 rounded-2xl cursor-pointer hover:border-blue-500 transition-all duration-300 group">
                <input type="radio" name="career_track" value="Embedded Systems Engineer" class="w-4 h-4 text-blue-600 bg-gray-900 border-gray-600 focus:ring-blue-500">
                <div class="ml-4">
                    <span class="block font-semibold text-white group-hover:text-blue-400 transition-colors">Embedded Systems Engineer</span>
                    <span class="text-xs text-gray-400">Build deep hardware-software integrations and low-level code.</span>
                </div>
            </label>

            <!-- Track 3 -->
            <label class="flex items-center p-4 bg-[#1f2937] border border-gray-700 rounded-2xl cursor-pointer hover:border-blue-500 transition-all duration-300 group">
                <input type="radio" name="career_track" value="Data Analyst" class="w-4 h-4 text-blue-600 bg-gray-900 border-gray-600 focus:ring-blue-500">
                <div class="ml-4">
                    <span class="block font-semibold text-white group-hover:text-blue-400 transition-colors">Data Analyst</span>
                    <span class="text-xs text-gray-400">Analyze patterns and build data insights.</span>
                </div>
            </label>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-medium py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all duration-300 cursor-pointer">
                Launch My Roadmap
            </button>

        </form>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('careerForm');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Safely read user skills saved from onboarding.html
                let rawSkills = localStorage.getItem('user_skills');
                let skillsArray = rawSkills ? JSON.parse(rawSkills) : ["C", "HTML", "CSS"];

                // Read selected radio button
                const selectedRadio = document.querySelector('input[name="career_track"]:checked');
                const targetRole = selectedRadio ? selectedRadio.value : "Frontend Developer";

                // Construct backend JSON payload
                const payload = {
                    skills: skillsArray,
                    targetRole: targetRole
                };

                console.log("Constructed Backend Payload:", payload);

                // Alert popup to confirm it's working
                alert(`Success! Roadmap Initialized.\n\nBackend Payload:\n${JSON.stringify(payload, null, 2)}`);
            });
        });
    </script>

</body>
</html>
