<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quest Board</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  
  <!-- The container where our JavaScript will render the app -->
  <div id="quest-board-root"></div>

  <script>
    // --- Configuration ---
    // Change this to test the "no user" state
    const currentUserId = 'user_123'; 
    
    // --- DOM Elements ---
    const rootElement = document.getElementById('quest-board-root');

    // --- Helper Functions ---
    const getDifficultyBadge = (difficulty) => {
      const level = (difficulty || '').toLowerCase();
      switch (level) {
        case 'easy':
        case 'beginner':
          return 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50';
        case 'medium':
        case 'intermediate':
          return 'bg-amber-950/60 text-amber-400 border-amber-800/50';
        case 'hard':
        case 'advanced':
          return 'bg-red-950/60 text-red-400 border-red-800/50';
        default:
          return 'bg-blue-950/60 text-blue-400 border-blue-800/50';
      }
    };

    // --- UI Renderers ---
    const renderHeader = () => `
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <div>
          <h2 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
            <span>🎯</span> Available Quests
          </h2>
          <p class="text-sm text-gray-400 mt-1">
            AI-curated missions tailored to bridge your current skill gaps.
          </p>
        </div>
      </div>
    `;

    const renderSkeletons = () => {
      return Array.from({ length: 3 }).map(() => `
        <div class="bg-[#1f2937]/50 border border-gray-800 rounded-2xl p-6 flex flex-col justify-between h-64 animate-pulse">
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <div class="h-5 w-20 bg-gray-700/60 rounded-full"></div>
              <div class="h-4 w-16 bg-gray-700/40 rounded"></div>
            </div>
            <div class="h-6 w-3/4 bg-gray-700/80 rounded-md"></div>
            <div class="flex gap-2 pt-2">
              <div class="h-6 w-14 bg-gray-700/50 rounded-lg"></div>
              <div class="h-6 w-16 bg-gray-700/50 rounded-lg"></div>
              <div class="h-6 w-12 bg-gray-700/50 rounded-lg"></div>
            </div>
          </div>
          <div class="h-10 w-full bg-gray-700/60 rounded-xl mt-6"></div>
        </div>
      `).join('');
    };

    const renderQuests = (quests) => {
      if (quests.length === 0) {
        return `<div class="col-span-3 text-center text-gray-400 py-10">No quests found for this user.</div>`;
      }

      return quests.map((quest) => `
        <div class="bg-[#1f2937]/70 border border-gray-800 hover:border-blue-500/50 rounded-2xl p-6 flex flex-col justify-between transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/10 group">
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs font-semibold px-3 py-1 rounded-full border ${getDifficultyBadge(quest.difficulty)}">
                ${quest.difficulty || 'Medium'}
              </span>
              <span class="text-xs text-gray-400 flex items-center gap-1 font-medium">
                ⏱️ ${quest.estimatedHours || 2} hrs
              </span>
            </div>

            <h3 class="text-lg font-bold text-white group-hover:text-blue-400 transition-colors line-clamp-2 mb-4">
              ${quest.title}
            </h3>

            <div class="flex flex-wrap gap-1.5 mb-6">
              ${(quest.skillsCovered || []).map(skill => `
                <span class="text-xs px-2.5 py-1 rounded-md bg-gray-800 text-gray-300 border border-gray-700/60 font-medium">
                  ${skill}
                </span>
              `).join('')}
            </div>
          </div>

          <button 
            type="button" 
            onclick="console.log('Starting Quest: ${quest.title.replace(/'/g, "\\'")}')" 
            class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all duration-200 shadow-md shadow-blue-600/20 active:scale-[0.98]"
          >
            Start Mission
          </button>
        </div>
      `).join('');
    };

    const updateUI = ({ loading, error, quests, userId }) => {
      if (!userId) {
        rootElement.innerHTML = `
          <div class="w-full max-w-6xl mx-auto p-6 text-center text-gray-400">
            Please select a user to view available quests.
          </div>
        `;
        return;
      }

      const errorHtml = error 
        ? `<div class="p-4 rounded-xl bg-red-950/40 border border-red-800/50 text-red-400 text-sm mb-6">
            ⚠️ Failed to load quests: ${error}
           </div>` 
        : '';

      const contentHtml = loading ? renderSkeletons() : renderQuests(quests);

      rootElement.innerHTML = `
        <div class="w-full max-w-6xl mx-auto p-6 space-y-6">
          ${renderHeader()}
          ${errorHtml}
          ${!error ? `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">${contentHtml}</div>` : ''}
        </div>
      `;
    };

    // --- Data Fetching (Main Logic) ---
    let currentAbortController = null;

    const fetchQuests = async (userId) => {
      if (!userId) {
        updateUI({ loading: false, error: null, quests: [], userId: null });
        return;
      }

      // Initial loading state
      updateUI({ loading: true, error: null, quests: [], userId });

      // Cancel previous request if a new one is fired
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();

      try {
        const response = await fetch(`http://localhost:5000/api/quests/${userId}`, {
          signal: currentAbortController.signal
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        updateUI({ loading: false, error: null, quests: data, userId });

      } catch (err) {
        if (err.name !== 'AbortError') {
          updateUI({ loading: false, error: err.message, quests: [], userId });
        }
      }
    };

    // Initialize the app
    fetchQuests(currentUserId);

  </script>
</body>
</html>
