<!-- 💬 Aroha Chat Modal Component -->
<div id="chatModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-end p-4 hidden">
    <div class="bg-[#111827] border border-gray-800 rounded-3xl w-full max-w-md max-h-[600px] shadow-2xl flex flex-col">
        
        <!-- Chat Header -->
        <div class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 p-4 rounded-t-3xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-bold text-white">🤖</div>
                <div>
                    <h3 class="font-bold text-white text-sm">Chat with Aroha</h3>
                    <p class="text-xs text-blue-100">Your AI Career Mentor</p>
                </div>
            </div>
            <button id="closeChatBtn" class="text-white hover:bg-white/20 p-2 rounded-xl transition-all">✕</button>
        </div>

        <!-- Messages Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[#0f1419]">
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-600/30 flex items-center justify-center text-xs flex-shrink-0">🤖</div>
                <div class="bg-[#1f2937] rounded-2xl p-3 max-w-xs">
                    <p class="text-sm text-gray-300">Hi! I'm Aroha. Ask me anything about your career path, skills, or learning journey!</p>
                </div>
            </div>
        </div>

        <!-- Suggested Questions -->
        <div id="suggestedQuestions" class="px-4 py-3 space-y-2 bg-[#0f1419]">
            <p class="text-xs text-gray-500 font-semibold">Quick Questions:</p>
            <div class="space-y-2">
                <button class="chat-suggestion w-full text-left bg-[#1f2937] hover:bg-blue-900/30 border border-gray-800 hover:border-blue-600 rounded-xl px-3 py-2 text-xs text-gray-300 transition-all" data-question="What skills should I focus on next?">📚 What skills should I learn first?</button>
                <button class="chat-suggestion w-full text-left bg-[#1f2937] hover:bg-blue-900/30 border border-gray-800 hover:border-blue-600 rounded-xl px-3 py-2 text-xs text-gray-300 transition-all" data-question="How ready am I for my target role?">📊 How ready am I for my target role?</button>
                <button class="chat-suggestion w-full text-left bg-[#1f2937] hover:bg-blue-900/30 border border-gray-800 hover:border-blue-600 rounded-xl px-3 py-2 text-xs text-gray-300 transition-all" data-question="Show me my personalized learning roadmap">🛣️ Show me my learning roadmap</button>
                <button class="chat-suggestion w-full text-left bg-[#1f2937] hover:bg-blue-900/30 border border-gray-800 hover:border-blue-600 rounded-xl px-3 py-2 text-xs text-gray-300 transition-all" data-question="What are the top companies hiring for my role?">🏢 Top companies hiring (DEMO)</button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2 p-4 bg-[#0f1419] border-t border-gray-800 rounded-b-3xl">
            <input 
                type="text" 
                id="chatInput" 
                placeholder="Ask Aroha anything..." 
                class="flex-1 bg-[#1f2937] border border-gray-700 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
            >
            <button id="sendChatBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-semibold text-sm transition-all active:scale-95">
                Send
            </button>
        </div>
    </div>
</div>

<script>
// Chat Modal Logic (add to main.html script section)
document.addEventListener('DOMContentLoaded', () => {
    const chatModal = document.getElementById('chatModal');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const suggestedQuestions = document.getElementById('suggestedQuestions');

    // Open Chat (Floating Button - add this button to main.html header)
    window.openChat = () => {
        chatModal.classList.remove('hidden');
    };

    // Close Chat
    closeChatBtn.addEventListener('click', () => {
        chatModal.classList.add('hidden');
    });

    // Send Message
    const sendMessage = async (message) => {
        if (!message.trim()) return;

        // Add user message
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'flex gap-3 justify-end';
        userMsgDiv.innerHTML = `
            <div class="bg-blue-600 rounded-2xl p-3 max-w-xs">
                <p class="text-sm text-white">${message}</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-purple-600/30 flex items-center justify-center text-xs flex-shrink-0">👤</div>
        `;
        chatMessages.appendChild(userMsgDiv);
        chatInput.value = '';
        suggestedQuestions.classList.add('hidden');
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Get user data for context
        const userName = localStorage.getItem('user_name') || 'Student';
        const userSkillsStr = localStorage.getItem('user_skills') || '[]';
        const targetRole = localStorage.getItem('user_target_role') || 'Frontend Developer';
        let currentSkills = [];
        try {
            currentSkills = JSON.parse(userSkillsStr);
        } catch (e) {
            currentSkills = [];
        }

        try {
            // Call backend API
            const response = await fetch('http://localhost:5000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: localStorage.getItem('user_id') || 'demo-user',
                    question: message
                })
            });

            const data = await response.json();
            const answer = data.answer || 'I couldn\'t process that. Try asking about your skills or learning path!';

            // Add Aroha response
            const arohaMsg = document.createElement('div');
            arohaMsg.className = 'flex gap-3';
            arohaMsg.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-600/30 flex items-center justify-center text-xs flex-shrink-0">🤖</div>
                <div class="bg-[#1f2937] rounded-2xl p-3 max-w-xs">
                    <p class="text-sm text-gray-300">${answer}</p>
                </div>
            `;
            chatMessages.appendChild(arohaMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch (err) {
            const errorMsg = document.createElement('div');
            errorMsg.className = 'flex gap-3';
            errorMsg.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-600/30 flex items-center justify-center text-xs flex-shrink-0">🤖</div>
                <div class="bg-[#1f2937] rounded-2xl p-3 max-w-xs">
                    <p class="text-sm text-gray-300">Connection error. Try again!</p>
                </div>
            `;
            chatMessages.appendChild(errorMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    };

    sendChatBtn.addEventListener('click', () => {
        const message = chatInput.value;
        sendMessage(message);
    });

    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage(chatInput.value);
    });

    // Suggested Questions Handler
    document.querySelectorAll('.chat-suggestion').forEach(btn => {
        btn.addEventListener('click', () => {
            const question = btn.getAttribute('data-question');
            chatInput.value = question;
            sendMessage(question);
        });
    });
});
</script>
